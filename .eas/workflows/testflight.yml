name: Build and send to TestFlight

# Run by hand from expo.dev (Workflows > Run) or: eas workflow:run testflight.yml
# Builds the production iOS app in Expo's cloud (no Mac needed) and uploads it to TestFlight.
on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  testflight:
    name: Send to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      changelog: 'New test build of Farm Direct.'
