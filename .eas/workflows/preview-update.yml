name: Publish preview update

# Publishes the app to the "preview" update branch whenever code is pushed to main or a claude/ branch.
# Open it on your iPhone in Expo Go: Expo Go > Projects > Farm Direct > preview.
on:
  push:
    branches: ['main', 'claude/**']

jobs:
  update_preview:
    name: Update (preview)
    type: update
    environment: preview
    params:
      branch: preview
      platform: ios
