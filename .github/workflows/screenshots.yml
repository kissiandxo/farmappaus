name: App Store screenshots (simulator)

# Builds the app for the iPhone simulator and takes the App Store screenshots.
# Uses only Apple's own tools (simctl). Run by hand, or push a commit whose
# message contains [screenshots].
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**", "main"]

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      # Skips the first-launch welcome and pre-saves three places. Simulator build only.
      EXPO_PUBLIC_SCREENSHOT_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the machine
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build for the simulator
        run: |
          xcodebuild -workspace ios/FarmDirect.xcworkspace -scheme FarmDirect -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Boot a 6.9-inch iPhone simulator
        run: |
          xcrun simctl list devices available | grep -i "Pro Max" || true
          UDID=$(xcrun simctl list devices available | grep -i "Pro Max" | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/FarmDirect.app
      - name: Take screenshots
        run: |
          mkdir -p shots
          # The app (screenshot mode) moves to the next screen every 20 s after launch:
          # Explore, Map, a market, a farm shop, Saved, then Explore again (taken in dark mode).
          xcrun simctl launch "$UDID" au.farmdirect.app
          sleep 14
          for name in 01-explore 02-map 03-market 04-farm-shop 05-saved; do
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
            sleep 20
          done
          xcrun simctl ui "$UDID" appearance dark
          sleep 6
          xcrun simctl io "$UDID" screenshot "shots/06-explore-dark.png"
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: shots/*.png
          if-no-files-found: warn
