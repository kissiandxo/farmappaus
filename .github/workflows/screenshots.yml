name: App Store screenshots (simulator)

# Builds the app for the iPhone simulator and takes the App Store screenshots.
# Uses only Apple's own tools (simctl). Run by hand, or push a commit whose
# message contains [screenshots].
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**", "main"]

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]') || contains(github.event.head_commit.message, '[launch-demo]')
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL || 'support@visera.vision' }}
      EXPO_PUBLIC_OPERATOR_NAME: ${{ vars.OPERATOR_NAME || 'Phoenix Jennings' }}
      # Skips the first-launch welcome and pre-saves three places. Simulator build only.
      EXPO_PUBLIC_SCREENSHOT_MODE: ${{ contains(github.event.head_commit.message, '[launch-demo]') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the contact and operator variables
        run: |
          # Warn, don't fail: the screenshots still work, but About shows no contact address.
          if [ -z "$EXPO_PUBLIC_SUPPORT_EMAIL" ]; then
            echo "::warning::Set the SUPPORT_EMAIL repository variable. These screenshots show no contact address."
          fi
          if [ -z "$EXPO_PUBLIC_OPERATOR_NAME" ]; then
            echo "::warning::Set the OPERATOR_NAME repository variable."
          fi
      - name: Use the newest released Xcode on the machine
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc|candidate' | sort -V | tail -1 || true)
          MAJOR=0
          if [ -n "$XCODE" ]; then
            VERSION=$(basename "$XCODE" .app | sed -E 's/^Xcode_//')
            MAJOR=$(echo "$VERSION" | grep -oE '^[0-9]+' || echo 0)
          fi
          if [ -z "$XCODE" ] || [ "$MAJOR" -lt 26 ]; then
            FALLBACK=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "::warning::No released Xcode 26 or newer found (best released: ${XCODE:-none}). Falling back to $FALLBACK."
            XCODE=$FALLBACK
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build for the simulator
        run: |
          xcodebuild -workspace ios/FarmDirect.xcworkspace -scheme FarmDirect -configuration Release \
            -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - name: Preserve the release simulator build for interaction tests
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '0'
        run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/FarmDirect.app /tmp/farm-iphone-build.zip
      - uses: actions/upload-artifact@v4
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '0'
        with:
          name: iphone-simulator-build
          path: /tmp/farm-iphone-build.zip
          retention-days: 1
      - name: Boot a 6.9-inch iPhone simulator
        run: |
          xcrun simctl list devices available | grep -i "Pro Max" || true
          UDID=$(xcrun simctl list devices available | grep -i "Pro Max" | tail -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/FarmDirect.app
      - name: Exercise the release onboarding and record real taps
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '0'
        timeout-minutes: 35
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: |
          set -euo pipefail
          mkdir -p /tmp/farm-release-capture
          curl -fsSL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o /tmp/farm-maestro.zip
          echo '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  /tmp/farm-maestro.zip' | shasum -a 256 -c -
          unzip -q /tmp/farm-maestro.zip -d /tmp/farm-maestro
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          xcrun simctl io "$UDID" recordVideo --force --codec=h264 /tmp/farm-release-capture/gestures.mp4 >/tmp/farm-record.log 2>&1 &
          recorder=$!
          trap 'kill -INT "$recorder" 2>/dev/null || true; wait "$recorder" || true' EXIT
          /tmp/farm-maestro/maestro/bin/maestro --device "$UDID" test --test-output-dir /tmp/farm-release-capture/test-results marketing/launch-film/demo.yaml
      - name: Save the verified interaction recording
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '0'
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p marketing/launch-film/source
          ffmpeg -nostdin -y -loglevel error -i /tmp/farm-release-capture/gestures.mp4 -vf 'fps=30,scale=1080:-2' -an -c:v libx264 -preset fast -crf 20 -movflags +faststart marketing/launch-film/source/gestures.mp4
          for shot in 09-welcome 10-tour 11-meat-filter 12-butcher; do
            cp "/tmp/farm-release-capture/test-results/takeScreenshot/$shot.png" marketing/launch-film/source/
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/launch-film/source/
          git commit -m 'Capture native onboarding, filter selection and saving a butcher'
          git push origin HEAD:"capture/iphone-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always() && env.EXPO_PUBLIC_SCREENSHOT_MODE == '0'
        with:
          name: interaction-capture
          path: /tmp/farm-release-capture
      - name: Take screenshots
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '1'
        timeout-minutes: 40
        run: |
          set +e
          mkdir -p shots
          # macOS has no `timeout`: run a command, killing it after N seconds.
          limit() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          sim() { limit 60 xcrun simctl "$@" || echo "::warning::simctl $* failed or timed out"; }
          shot() { limit 60 xcrun simctl io "$UDID" screenshot "shots/$1.png" || echo "::warning::Screenshot $1 failed or timed out"; }
          # The app (screenshot mode) moves on ONE scene each time the appearance goes from dark back to light
          # (SCREENSHOT_SCENES in src/config.ts; no timers). `next N` ticks once, then waits N seconds to settle.
          next() { sim ui "$UDID" appearance dark; sleep 10; sim ui "$UDID" appearance light; sleep "$1"; }
          sim launch "$UDID" au.farmdirect.app
          sleep 45
          shot 01-explore
          mkdir -p media
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force media/simulator.mp4 >media/capture.log 2>&1 &
          RECORDER=$!
          next 12
          shot 09-welcome
          next 5
          shot 10-tour
          sleep 26
          next 20
          shot 02-explore-meat
          next 20
          shot 08-place-butcher
          next 20
          shot 03-place-meat
          kill -INT "$RECORDER"
          wait "$RECORDER"
          next 20
          shot 04-place-market
          next 20
          shot 05-saved
          # The map is the last scene (the tour cannot step past it; see SCREENSHOT_SCENES).
          next 40
          shot 06-map
          # Same scene in dark appearance: no step needed, just time for the map to redraw.
          sim ui "$UDID" appearance dark
          sleep 30
          shot 07-map-dark
          ls shots/*.png >/dev/null 2>&1 && limit 60 sips -g pixelWidth -g pixelHeight shots/*.png
          exit 0
      - uses: actions/upload-artifact@v4
        if: always() && env.EXPO_PUBLIC_SCREENSHOT_MODE == '1'
        with:
          name: app-store-screenshots
          path: shots/*.png
          if-no-files-found: warn

      - name: Compress the iPhone screen recording for editing
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '1'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i media/simulator.mp4 -vf "fps=30,scale=1080:-2" -an -c:v libx264 -preset fast -crf 20 -movflags +faststart media/simulator-edit.mp4
      - uses: actions/upload-artifact@v4
        if: env.EXPO_PUBLIC_SCREENSHOT_MODE == '1'
        with:
          name: simulator-footage
          path: media/simulator-edit.mp4
          if-no-files-found: error
