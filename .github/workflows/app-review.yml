name: Prepare App Store review
on:
  push:
    branches: ["claude/**", "main"]
permissions:
  contents: read
concurrency:
  group: farm-direct-review
  cancel-in-progress: false
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[app-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install "PyJWT[crypto]==2.10.1" "requests==2.32.5"
      - name: Prepare Farm Direct listing
        env:
          ASC_KEY_ID: RLG22BW6CR
          ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SUBMIT_BUILD: ${{ contains(github.event.head_commit.message, '[submit-42]') && '42' || '' }}
        run: python scripts/app-store-release.py
