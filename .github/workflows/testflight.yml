name: TestFlight (GitHub Mac build)

# Runs when you push a commit whose message contains [testflight],
# or by hand: GitHub → Actions → this workflow → Run workflow.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**", "main"]

jobs:
  ios:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    # Expo SDK 58's Swift packages need Swift 6.2, i.e. Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: RLG22BW6CR
      ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Apple key secret is set
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Add the ASC_KEY_P8 secret (Settings → Secrets and variables → Actions)."; exit 1
          fi
      - name: Use the newest Xcode on the machine
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build, sign and upload to TestFlight
        run: fastlane ios beta
