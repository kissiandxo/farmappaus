name: Recover original weekend screenshot
on:
  push:
    branches: ["capture/native-weekend-frame"]
permissions:
  actions: read
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45682505713
          github-token: ${{ github.token }}
          name: interaction-capture
          path: footage
      - name: Collect the original screen recording and screenshots
        shell: bash
        run: |
          set -euo pipefail
          shot=$(find footage/test-results -type f -name 'step-038-assertCondition-*.png' -print -quit)
          test -s "$shot"
          cp "$shot" marketing/launch-film/source/15-weekend.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/launch-film/source/15-weekend.png
          git commit -m 'Recover the original iPhone interaction recording and native screenshots'
          git push origin HEAD:refs/heads/capture/weekend-frame-45682505713
