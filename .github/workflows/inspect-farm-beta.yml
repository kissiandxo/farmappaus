name: Check the existing TestFlight directory
on:
  push:
    branches: ['capture/team-testflight-lookup']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install "PyJWT[crypto]==2.10.1" "requests==2.32.5"
      - name: Check Apple records
        env:
          ASC_KEY_ID: RLG22BW6CR
          ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python - <<'PY'
          import runpy
          g=runpy.run_path('scripts/app-store-release.py')
          rows=g['api']('GET','/v1/betaTesters',params={'filter[firstName]':'Emma','limit':200})
          matches=[r for r in rows if (r['attributes'].get('firstName') or '').strip().lower()=='emma' and r['attributes'].get('email')]
          print('Existing TestFlight testers named Emma with an email address:',len(matches))
          PY
