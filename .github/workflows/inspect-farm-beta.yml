name: Update Farm Direct store copy
on:
  push:
    branches: ['capture/store-copy-ready']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install "PyJWT[crypto]==2.10.1" "requests==2.32.5"
      - name: Check Apple records
        env:
          ASC_KEY_ID: RLG22BW6CR
          ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python - <<'PY'
          import runpy
          g=runpy.run_path('scripts/app-store-release.py')
          api,child,write,rel=(g[name] for name in ('api','child','write','rel'))
          target=g['app']('au.farmdirect.app')
          version=next(v for v in child(target,'appStoreVersions',params={'filter[platform]':'IOS'}) if v['attributes']['versionString'] in ('1.0','1.0.0'))
          if g['already_submitted'](version,None): raise SystemExit(0)
          locale=target['attributes']['primaryLocale']
          loc=g['localization'](version,'appStoreVersionLocalizations',locale)
          description=g['section']('Description').split('\nThe "Report')[0].strip()
          write(loc['type'],{'description':description,'promotionalText':g['section']('Promotional text')},id=loc['id'])
          assert api('GET','/v1/appStoreVersionLocalizations/'+loc['id'])['attributes']['description']==description
          g['review_details'](version)
          print('Verified the market-date and weekend-shopping description and saved the reviewer walkthrough.')
          builds=api('GET','/v1/builds',params={'filter[app]':target['id'],'filter[version]':'62','filter[preReleaseVersion.version]':'1.0.0'})
          if builds and builds[0]['attributes']['processingState']=='VALID':
              write(version['type'],relations={'build':rel('builds',builds[0]['id'])},id=version['id'])
              print('Processed build selected in the unsubmitted draft:',child(version,'build')['attributes']['version'])
          PY
