name: Confirm the Australian Farm Direct release
on:
  push:
    branches: ['capture/confirm-submitted-63']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install "PyJWT[crypto]==2.10.1" "requests==2.32.5"
      - name: Check Apple records
        env:
          ASC_KEY_ID: RLG22BW6CR
          ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python - <<'PY'
          import runpy
          g=runpy.run_path('scripts/app-store-release.py');child=g['child']
          app=g['app']('au.farmdirect.app')
          v=next(v for v in child(app,'appStoreVersions',params={'filter[platform]':'IOS'}) if v['attributes']['versionString'] in ('1.0','1.0.0'))
          a=v['attributes']
          b=child(v,'build')
          print('Store version:',a['versionString'],'build:',b['attributes']['version'],'release:',a['releaseType'],'state:',a.get('appVersionState') or a['appStoreState'])
          loc=g['localization'](v,'appStoreVersionLocalizations',app['attributes']['primaryLocale'])
          for group in child(loc,'appScreenshotSets'):
              if group['attributes']['screenshotDisplayType']=='APP_IPHONE_67':
                  shots=child(group,'appScreenshots')
                  print('Complete screenshots:',sum(s['attributes']['assetDeliveryState']['state']=='COMPLETE' for s in shots))
          for group in child(loc,'appPreviewSets'):
              if group['attributes']['previewType']=='IPHONE_67':
                  print('Ready previews:',sum(p['attributes'].get('videoDeliveryState',{}).get('state')=='COMPLETE' for p in child(group,'appPreviews')))
          detail=child(b,'buildBetaDetail')
          print('External beta build:',detail['attributes']['externalBuildState'])
          groups=child(app,'betaGroups')
          for group in groups:
              if group['attributes']['name']=='Farm Direct Testers':
                  members=child(group,'betaTesters')
                  matched=any((m['attributes'].get('firstName') or '').lower()=='emma' for m in members)
                  print('Emma listed in private TestFlight group:',matched)
                  external=[row for row in groups if not row['attributes']['isInternalGroup']]
                  if (matched and len(members)==1 and len(external)==1 and not group['attributes'].get('publicLinkEnabled')
                          and detail['attributes']['externalBuildState'] in ('WAITING_FOR_BETA_REVIEW','IN_BETA_REVIEW')
                          and not detail['attributes'].get('autoNotifyEnabled')):
                      g['write'](detail['type'],{'autoNotifyEnabled':True},id=detail['id'])
                  print('Apple beta availability notification enabled:',child(b,'buildBetaDetail')['attributes'].get('autoNotifyEnabled'))
          PY
