name: Verify Farm Direct review readiness
on:
  push:
    branches: ['capture/check-privacy-61']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip -q install "PyJWT[crypto]==2.10.1" "requests==2.32.5"
      - name: Check Apple records
        env:
          ASC_KEY_ID: RLG22BW6CR
          ASC_ISSUER_ID: a8d1088f-f4d4-4d6f-ba48-88aee1bc2623
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python - <<'PY'
          import runpy
          g=runpy.run_path('scripts/app-store-release.py')
          api,child,write,rel=(g[name] for name in ('api','child','write','rel'))
          target=g['app']('au.farmdirect.app')
          version=next(v for v in child(target,'appStoreVersions',params={'filter[platform]':'IOS'}) if v['attributes']['versionString'] in ('1.0','1.0.0'))
          if g['already_submitted'](version,None):
              raise SystemExit(0)
          builds=api('GET','/v1/builds',params={'filter[app]':target['id'],'filter[version]':'61','filter[preReleaseVersion.version]':'1.0.0'})
          if not builds or builds[0]['attributes']['processingState']!='VALID':
              raise RuntimeError('Apple has not finished processing build 61')
          build=builds[0]
          selected=child(version,'build',optional=True)
          if not selected or selected['id']!=build['id']:
              write(version['type'],relations={'build':rel('builds',build['id'])},id=version['id'])
          print('Using the processed market-calendar build:',build['attributes']['version'])
          drafts=child(target,'reviewSubmissions',params={'filter[platform]':'IOS'})
          empty=None
          for draft in drafts:
              if draft['attributes']['state']!='READY_FOR_REVIEW': continue
              items=child(draft,'items',params={'include':'appStoreVersion'})
              if not items: empty=draft
              if any((i['relationships'].get('appStoreVersion',{}).get('data') or {}).get('id')==version['id'] for i in items):
                  print('Apple already accepted this version into the review draft.')
                  raise SystemExit(0)
          draft=empty or write('reviewSubmissions',{'platform':'IOS'},{'app':rel('apps',target['id'])})
          item=write('reviewSubmissionItems',relations={'reviewSubmission':rel(draft['type'],draft['id']),'appStoreVersion':rel(version['type'],version['id'])})
          print('Apple accepted the review item, including its App Privacy prerequisite. Item state:',item['attributes']['state'])
          PY
