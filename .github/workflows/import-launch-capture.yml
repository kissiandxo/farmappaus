name: Import launch capture
on:
  push:
    branches: ["claude/farm-to-consumer-ios-app-v8uy52"]
jobs:
  import:
    if: contains(github.event.head_commit.message, '[import-capture]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wait for simulator capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 45602600542 --interval 30 --exit-status
      - uses: actions/download-artifact@v4
        with:
          run-id: 45602600542
          github-token: ${{ github.token }}
          name: simulator-footage
          path: footage
      - uses: actions/download-artifact@v4
        with:
          run-id: 45602600542
          github-token: ${{ github.token }}
          name: app-store-screenshots
          path: screens
      - name: Save the actual iPhone recording and onboarding screenshots
        run: |
          mkdir -p marketing/launch-film/source
          cp footage/simulator-edit.mp4 marketing/launch-film/source/iphone-simulator.mp4
          cp screens/{09-welcome,10-tour}.png marketing/app-store-screenshots/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/launch-film/source marketing/app-store-screenshots
          git commit -m 'Save actual iPhone simulator recording and onboarding screens'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
